name: Update Recession Monitor

on:
  schedule:
    - cron: '0 22 * * 1-5'   # Mon-Fri 22:00 UTC (NYSE close + 2h)
  workflow_dispatch:           # manual trigger button

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unified data fetcher (v3)
        run: python scripts/update_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # opcional — activa Sahm oficial, UMich, savings rate

      - name: Show generated files
        run: ls -la docs/*.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
